apiVersion: apps/v1
kind: Deployment
metadata:
  name: gloo-2414
spec:
  selector:
    matchLabels:
      app: gloo-2414
  replicas: {{ .Values.gloo2414DesiredReplicas }}
  template:
    metadata:
      labels:
        app: gloo-2414
    spec:
      tolerations:
      - key: "environment"
        operator: "Equal"
        value: "ml"
        effect: "NoSchedule"
{{- if .Values.gloo2414NodeSelector }} # <--- Start of conditional block
      nodeSelector:
{{- $label := split "=" .Values.gloo2414NodeSelector }}
        {{ $label._0 }}: "{{ $label._1 }}"
{{- end }}
      containers:
        - name: gloo-2414
          image: {{ .Values.image }}
          imagePullPolicy: {{ .Values.containerImagePullPolicy }}
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: {{ .Values.gloo2414MemoryRequest }}
              cpu: {{ .Values.gloo2414CPURequest }}
            limits:
              memory: {{ .Values.gloo2414MemoryLimit }}
              cpu: {{ .Values.gloo2414CPULimit }}
